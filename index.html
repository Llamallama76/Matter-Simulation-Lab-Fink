<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="MATTERVERSE — Florida Grade 5 Science Unit 4: 10-Station Interactive 3D Matter & Solutions Laboratory"
    />
    <title>MATTERVERSE: Grade 5 Matter & Solutions Laboratory</title>
    <style>
      :root {
        --bg-deep: #070b14;
        --panel-bg: rgba(11, 19, 35, 0.88);
        --panel-border: rgba(94, 234, 212, 0.35);
        --accent-cyan: #2dd4bf;
        --accent-amber: #fbbf24;
        --text-primary: #f8fafc;
        --text-muted: #cbd5e1;
        --ui-scale: 1;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      html.smartboard-large-text {
        --ui-scale: 1.28;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-deep);
        color: var(--text-primary);
        user-select: none;
        -webkit-user-select: none;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #viewport-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-size: calc(16px * var(--ui-scale));
      }

      #hud-root button,
      #hud-root input,
      #hud-root select,
      #hud-root .interactive-panel {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport-canvas" aria-label="Matterverse 3D Science Laboratory"></canvas>
      <div id="hud-root" role="region" aria-label="Laboratory Controls and Science Journal"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
